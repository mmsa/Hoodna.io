# Render Blueprint: eljiran backend + Postgres
# Docs: https://render.com/docs/blueprint-spec

envVarGroups:
  - name: eljiran-ops-secrets
    envVars:
      - key: CRON_SECRET
        generateValue: true

databases:
  - name: eljiran-db
    plan: free
    databaseName: eljiran
    user: eljiran

services:
  - type: web
    name: eljiran-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: chmod +x start.sh && ./start.sh
    healthCheckPath: /health
    envVars:
      - fromGroup: eljiran-ops-secrets
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eljiran-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        value: https://eljiran.io
      - key: CORS_ORIGINS
        value: '["https://eljiran.io","https://www.eljiran.io","https://eljiran.vercel.app"]'
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET_NAME
        sync: false
      - key: SES_FROM_EMAIL
        value: hello@eljiran.io
      - key: SES_FROM_NAME
        value: Eljiran
      - key: OPENAI_API_KEY
        sync: false
      - key: SMS_PROVIDER
        value: "none"
      - key: SMSTO_API_KEY
        sync: false
      - key: SMSTO_SENDER_ID
        value: "Eljiran"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE
        value: "eljiran_auth_otp"
      - key: WHATSAPP_OTP_TEMPLATE_LANG
        value: "en_US"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      # Pilot-ready defaults: enable globally or with scoped database overrides.
      - key: FEATURE_INVITATIONS_ENABLED
        value: "false"
      - key: FEATURE_BUSINESS_CLAIMING_ENABLED
        value: "false"
      - key: FEATURE_WEEKLY_DIGEST_ENABLED
        value: "false"
      - key: FEATURE_COMMUNITY_POSTING_ENABLED
        value: "false"
      - key: FEATURE_BUSINESS_REVIEWS_ENABLED
        value: "false"
      - key: FEATURE_USER_REGISTRATION_ENABLED
        value: "false"

  - type: cron
    name: eljiran-weekly-digest
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "0 7 * * 1"
    buildCommand: echo "No build required"
    startCommand: >-
      python -c "import os, urllib.request;
      request=urllib.request.Request(
      'https://eljiran-api.onrender.com/api/internal/jobs/weekly-digest',
      method='POST',
      headers={'X-Cron-Secret': os.environ['CRON_SECRET']});
      print(urllib.request.urlopen(request, timeout=300).read().decode())"
    envVars:
      - fromGroup: eljiran-ops-secrets
