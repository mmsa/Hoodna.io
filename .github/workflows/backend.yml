name: Deploy Backend

on:
  workflow_run:
    workflows: ["Tests"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    # Only proceed automatically if the Tests workflow concluded successfully.
    # Manual workflow_dispatch acts as an operator override.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        run: |
          docker buildx build \
            -f deploy/Dockerfile.backend.prod \
            -t eljiran-backend:${SHORT_SHA} \
            --load \
            .

      - name: Stream image to EC2 and load
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts || true

          echo "Streaming image to EC2 and loading with docker..."
          docker save eljiran-backend:${SHORT_SHA} | gzip | ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "gzip -d | docker load"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_REPOSITORY,GITHUB_REPOSITORY_OWNER,GHCR_TOKEN,SHORT_SHA
          script: |
            set -euo pipefail
            cd /home/ubuntu/eljiran
            git pull
            IMAGE_TAG="${SHORT_SHA}"
            IMAGE_REPO_BACKEND="eljiran-backend"
            IMAGE_TAG="${IMAGE_TAG}" IMAGE_REPO_BACKEND="${IMAGE_REPO_BACKEND}" GHCR_USERNAME="${GHCR_USERNAME:-}" GHCR_TOKEN="${GHCR_TOKEN:-}" \
              bash ./deploy/scripts/deploy_backend.sh
