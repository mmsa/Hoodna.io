name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.backend.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eljiran-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/eljiran-backend:${{ env.SHORT_SHA }}
            ghcr.io/${{ github.repository_owner }}/eljiran-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_REPOSITORY,GITHUB_REPOSITORY_OWNER,GHCR_TOKEN,SHORT_SHA
          script: |
            set -euo pipefail
            cd /home/ubuntu/eljiran
            git pull
            IMAGE_TAG="${SHORT_SHA}"
            IMAGE_REPO_BACKEND="ghcr.io/${GITHUB_REPOSITORY_OWNER}/eljiran-backend"
            GHCR_USERNAME="${GITHUB_REPOSITORY_OWNER}"
            GHCR_TOKEN="${GHCR_TOKEN:-}"
            IMAGE_TAG="${IMAGE_TAG}" IMAGE_REPO_BACKEND="${IMAGE_REPO_BACKEND}" GHCR_USERNAME="${GHCR_USERNAME}" GHCR_TOKEN="${GHCR_TOKEN}" \
              bash ./deploy/scripts/deploy_backend.sh
