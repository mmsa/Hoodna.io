name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        run: |
          docker buildx build \
            -f deploy/Dockerfile.backend.prod \
            -t eljiran-backend:${SHORT_SHA} \
            --load \
            .

      - name: Save backend image
        run: docker save eljiran-backend:${SHORT_SHA} -o backend.tar

      - name: Fix permissions on image tar
        run: chmod 644 backend.tar

      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend.tar"
          target: "/home/${{ secrets.EC2_USER }}/backend.tar"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_REPOSITORY,GITHUB_REPOSITORY_OWNER,GHCR_TOKEN,SHORT_SHA
          script: |
            set -euo pipefail
            cd /home/ubuntu/eljiran
            git pull
            # Ensure backend.tar is a file (clean up any previous directory)
            if [ -d /home/ubuntu/backend.tar ]; then rm -rf /home/ubuntu/backend.tar; fi
            if [ -f /home/ubuntu/backend.tar/backend.tar ]; then mv /home/ubuntu/backend.tar/backend.tar /home/ubuntu/backend.tar; fi
            docker load -i /home/ubuntu/backend.tar
            IMAGE_TAG="${SHORT_SHA}"
            IMAGE_REPO_BACKEND="eljiran-backend"
            IMAGE_TAG="${IMAGE_TAG}" IMAGE_REPO_BACKEND="${IMAGE_REPO_BACKEND}" GHCR_USERNAME="${GHCR_USERNAME}" GHCR_TOKEN="${GHCR_TOKEN}" \
              bash ./deploy/scripts/deploy_backend.sh
