name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt flake8
      
      - name: Run critical Python checks
        run: |
          cd backend
          python -m compileall -q app alembic tests
          flake8 app tests --select=E9,F63,F7,F82 --show-source

      - name: Run PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        run: |
          cd backend
          alembic upgrade head
      
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        run: |
          cd backend
          pytest --cov=app --cov-report=xml --cov-report=term
      
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend-ci:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            packages/shared/package-lock.json
            packages/tokens/package-lock.json
            frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          npm ci --prefix packages/shared
          npm ci --prefix packages/tokens
          npm ci --prefix frontend

      - name: Build local packages
        run: |
          npm run build --prefix packages/shared
          npm run build --prefix packages/tokens
      
      - name: Run linter
        run: npm run lint --prefix frontend
      
      - name: Run type check
        run: |
          cd frontend
          npx tsc --noEmit
      
      - name: Run unit tests
        run: npm run test:unit --prefix frontend
      
      - name: Build Next.js
        run: npm run build --prefix frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  shared-mobile-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            packages/shared/package-lock.json
            packages/tokens/package-lock.json
            mobile/package-lock.json

      - name: Install local and mobile packages
        run: |
          npm ci --prefix packages/shared
          npm ci --prefix packages/tokens
          npm ci --prefix mobile

      - name: Check shared contracts and tokens
        run: |
          npm run build --prefix packages/shared
          npm run build --prefix packages/tokens

      - name: Check mobile application
        run: |
          cd mobile
          npx tsc --noEmit
          npx expo config --type public
          npx expo-doctor

  ci-success:
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, shared-mobile-ci]
    steps:
      - name: CI Status
        run: echo "All launch-critical CI jobs passed"

